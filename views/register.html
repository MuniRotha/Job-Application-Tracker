<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create account | Job Application Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <main class="auth-page">
    <div class="auth-panel">
      <a class="brand" href="/login">
        <span class="brand-mark" aria-hidden="true"><span></span><span></span><span></span></span>
        Job Application Tracker
      </a>

      <h1>Create your account</h1>
      <p class="lede">Keep every application, interview and offer in one list.</p>

      <form id="register-form" novalidate>
        <div class="form-error" id="form-error" role="alert"></div>

        <div class="field">
          <label for="name">Name</label>
          <input type="text" id="name" name="name" autocomplete="name" maxlength="100" required>
        </div>

        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" autocomplete="email" required>
        </div>

        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" autocomplete="new-password" minlength="8" maxlength="72" required aria-describedby="password-hint">
          <span class="hint" id="password-hint">At least 8 characters.</span>
        </div>

        <button type="submit" class="btn btn-primary">Create account</button>
      </form>

      <p class="auth-switch">Already have an account? <a href="/login">Log in</a></p>
    </div>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
